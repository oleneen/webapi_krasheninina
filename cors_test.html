<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TODO API Test Client</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }
        .section { margin-bottom: 24px; }
        .controls { margin: 12px 0; }
        button {
            margin: 4px 6px 4px 0;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        input, select {
            padding: 4px 8px;
            margin: 0 4px;
            font-size: 14px;
        }
        .log {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 12px;
            font-family: monospace;
            font-size: 13px;
            white-space: pre-wrap;
            overflow-x: auto;
            height: 300px;
            overflow-y: auto;
        }
        .log-line {
            margin: 0;
            padding: 2px 0;
        }
        .log-line.info { color: #1a5f9e; }
        .log-line.success { color: #1e7e34; }
        .log-line.error { color: #d93025; }
        .log-line.ws { background-color: #e7f3ff; }
    </style>
</head>
<body>
    <h1>TODO API Test Client</h1>

    <div class="section">
        <h2>REST API</h2>
        <div class="controls">
            <button onclick="getTasks()">GET /tasks</button>
            <button onclick="createTask()">POST /tasks</button>
        </div>
        <div class="controls">
            <label>ID:</label>
            <input type="number" id="taskIdInput" value="1" min="1" style="width:60px">
            <button onclick="getTask()">GET /tasks/{id}</button>
            <button onclick="patchTask()">PATCH /tasks/{id}</button>
            <button onclick="deleteTask()">DELETE /tasks/{id}</button>
        </div>
        <div class="controls">
            <button onclick="runGenerator()">POST /task-generator/run</button>
        </div>
    </div>

    <div class="section">
        <h2>WebSocket</h2>
        <div class="controls">
            <button id="wsBtn" onclick="toggleWebSocket()">🔌 Connect to /ws/tasks</button>
            <span id="wsStatus" style="margin-left:10px; font-weight:bold; color:#666">Disconnected</span>
        </div>
    </div>

    <div class="log" id="log" aria-live="polite">
        <div class="log-line info">Log initialized.</div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const logElement = document.getElementById("log");
        const wsBtn = document.getElementById("wsBtn");
        const wsStatus = document.getElementById("wsStatus");
        let websocket = null;

        function appendLog(message, level = "info") {
            const timestamp = new Date().toISOString().substring(11, 23);
            const line = document.createElement("div");
            line.className = `log-line ${level}`;
            line.textContent = `[${timestamp}] ${message}`;
            logElement.appendChild(line);
            logElement.scrollTop = logElement.scrollHeight;
        }

        function clearLog() {
            logElement.innerHTML = "";
        }

        async function getTasks() {
            appendLog("GET /tasks");
            try {
                const res = await fetch(`${API_URL}/tasks`);
                const data = await res.json();
                appendLog(`${data.length} tasks received`, "success");
            } catch (e) {
                appendLog(`GET /tasks: ${e.message}`, "error");
            }
        }

        async function getTask() {
            const id = document.getElementById("taskIdInput").value;
            appendLog(`GET /tasks/${id}`);
            try {
                const res = await fetch(`${API_URL}/tasks/${id}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                appendLog(`Task ${id}: "${data.title}"`, "success");
            } catch (e) {
                appendLog(`GET /tasks/${id}: ${e.message}`, "error");
            }
        }

        async function createTask() {
            const payload = {
                title: "Test Task " + Date.now(),
                description: "Created via HTML client"
            };
            appendLog("POST /tasks");
            try {
                const res = await fetch(`${API_URL}/tasks`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                document.getElementById("taskIdInput").value = data.id;
                appendLog(`Task created: ID=${data.id}, "${data.title}"`, "success");
            } catch (e) {
                appendLog(`POST /tasks: ${e.message}`, "error");
            }
        }

        async function patchTask() {
            const id = document.getElementById("taskIdInput").value;
            const payload = { done: true };
            appendLog(`PATCH /tasks/${id} (mark as done)`);
            try {
                const res = await fetch(`${API_URL}/tasks/${id}`, {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                appendLog(`Task ${id} updated: done=${data.done}`, "success");
            } catch (e) {
                appendLog(`PATCH /tasks/${id}: ${e.message}`, "error");
            }
        }

        async function deleteTask() {
            const id = document.getElementById("taskIdInput").value;
            if (!confirm(`Delete task ${id}?`)) return;
            appendLog(`DELETE /tasks/${id}`);
            try {
                const res = await fetch(`${API_URL}/tasks/${id}`, { method: "DELETE" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                appendLog(`Task ${id} deleted`, "success");
            } catch (e) {
                appendLog(`DELETE /tasks/${id}: ${e.message}`, "error");
            }
        }

        async function runGenerator() {
            appendLog("POST /task-generator/run");
            try {
                const res = await fetch(`${API_URL}/task-generator/run`, { method: "POST" });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                appendLog(`Background task started: ${JSON.stringify(data)}`, "success");
            } catch (e) {
                appendLog(`POST /task-generator/run: ${e.message}`, "error");
            }
        }

        function toggleWebSocket() {
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.close();
                return;
            }

            websocket = new WebSocket(`ws://127.0.0.1:8000/ws/tasks`);
            wsBtn.textContent = "Connecting...";

            websocket.onopen = () => {
                wsStatus.textContent = "Connected";
                wsStatus.style.color = "#1e7e34";
                wsBtn.textContent = "Disconnect";
                appendLog("WebSocket connected", "ws");
            };

            websocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    appendLog(`WS: ${JSON.stringify(data)}`, "ws");
                } catch (e) {
                    appendLog(`WS (raw): ${event.data}`, "ws");
                }
            };

            websocket.onclose = () => {
                wsStatus.textContent = "Disconnected";
                wsStatus.style.color = "#666";
                wsBtn.textContent = "Connect to /ws/tasks";
                appendLog("WebSocket disconnected", "ws");
            };

            websocket.onerror = (error) => {
                appendLog(`WebSocket error: ${error.message}`, "error");
            };
        }
    </script>
</body>
</html>
